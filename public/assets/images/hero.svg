<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Technician repairing a washing machine at home">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f1fd"/>
    </linearGradient>
    <linearGradient id="hfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7fb"/>
      <stop offset="1" stop-color="#c7d9f6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" rx="28" fill="url(#hbg)"/>
  <circle cx="520" cy="110" r="70" fill="#ffc107" opacity=".25"/>
  <circle cx="90" cy="430" r="55" fill="#0d47a1" opacity=".08"/>
  <rect x="40" y="430" width="560" height="50" rx="12" fill="url(#hfloor)"/>

  <!-- Washing machine -->
  <rect x="370" y="250" width="170" height="190" rx="16" fill="#ffffff" stroke="#0d47a1" stroke-width="5"/>
  <rect x="370" y="250" width="170" height="40" rx="16" fill="#0d47a1"/>
  <circle cx="398" cy="270" r="6" fill="#ffc107"/>
  <rect x="470" y="265" width="50" height="10" rx="5" fill="#ffffff" opacity=".8"/>
  <circle cx="455" cy="365" r="62" fill="#eaf1fc" stroke="#0d47a1" stroke-width="5"/>
  <circle cx="455" cy="365" r="44" fill="#bcd6f7"/>
  <path d="M425 365a30 30 0 0 1 60 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Technician -->
  <g>
    <!-- legs -->
    <rect x="170" y="360" width="34" height="80" rx="12" fill="#13315f"/>
    <rect x="210" y="360" width="34" height="80" rx="12" fill="#13315f"/>
    <!-- body / uniform -->
    <path d="M160 250c0-26 22-46 48-46s48 20 48 46v110h-96z" fill="#1565c0"/>
    <rect x="196" y="250" width="24" height="110" fill="#0d47a1" opacity=".4"/>
    <!-- arm holding tool -->
    <rect x="246" y="270" width="70" height="22" rx="11" fill="#1565c0" transform="rotate(18 246 270)"/>
    <!-- head -->
    <circle cx="208" cy="178" r="34" fill="#f1c9a5"/>
    <path d="M174 172a34 34 0 0 1 68 0l-10 -4a26 26 0 0 0 -48 0z" fill="#3a2a1a"/>
    <!-- cap -->
    <path d="M170 150a38 38 0 0 1 76 0z" fill="#ffc107"/>
    <rect x="168" y="148" width="80" height="8" rx="4" fill="#e6ac00"/>
    <!-- wrench -->
    <rect x="300" y="288" width="60" height="14" rx="7" fill="#5b6472" transform="rotate(30 300 288)"/>
    <circle cx="352" cy="318" r="14" fill="none" stroke="#5b6472" stroke-width="8"/>
  </g>

  <!-- toolbox -->
  <rect x="70" y="400" width="80" height="42" rx="8" fill="#ffc107"/>
  <rect x="70" y="392" width="80" height="14" rx="6" fill="#e6ac00"/>
  <rect x="100" y="386" width="20" height="8" rx="4" fill="#0d47a1"/>

  <!-- spark / check badge -->
  <circle cx="300" cy="150" r="26" fill="#25d366"/>
  <path d="M289 150l8 8 16 -18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
